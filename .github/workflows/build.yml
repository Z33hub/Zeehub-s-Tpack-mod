name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Runs one at a time so two branches never edit the download release together.
concurrency:
  group: download-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: item-studio
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Update the download release
        # One release keeps the newest jar for every Minecraft version, so the
        # repo page always shows both. Each branch replaces only its own jar.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mc-26.2')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TITLE="Item Studio (1.21.11 + 26.2)"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "$TITLE" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          fi
          for a in $(gh release view latest --json assets --jq '.assets[].name'); do
            case "$a" in *"+mc${MC}.jar") gh release delete-asset latest "$a" -y ;; esac
          done
          gh release upload latest build/libs/*.jar --clobber
          gh release edit latest --title "$TITLE" --notes-file .github/release-notes.md --latest
