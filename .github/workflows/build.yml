name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: item-studio
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Item Studio build ${{ github.run_number }}
          body: |
            Download the .jar below and put it in your `.minecraft/mods` folder (Fabric, Minecraft 1.21.11, needs Fabric API).
            In game press Right Shift, or click Item Studio in the pause menu.
          files: build/libs/*.jar
